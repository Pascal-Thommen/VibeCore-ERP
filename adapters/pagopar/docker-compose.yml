services:
  pagopar-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibecore-pagopar-adapter
    restart: unless-stopped
    ports:
      - "${PAGOPAR_PORT:-8004}:8000"
    environment:
      - PAGOPAR_PUBLIC_KEY=${PAGOPAR_PUBLIC_KEY:-test_public_key}
      - PAGOPAR_PRIVATE_KEY=${PAGOPAR_PRIVATE_KEY:-test_private_key}
      - PAGOPAR_ENV=${PAGOPAR_ENV:-sandbox}
      - DATABASE_URL=sqlite:////data/pagopar_transactions.db
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-10.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - pagopar_data:/data

volumes:
  pagopar_data:
