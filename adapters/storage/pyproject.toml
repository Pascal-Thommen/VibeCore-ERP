[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vibecore-storage-adapter"
version = "0.1.0"
description = "VibeCore ERP S3-Compatible Object Storage Microservice Adapter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "boto3>=1.34,<2",
  "botocore>=1.34,<2",
  "python-multipart>=0.0.18,<1",
  "cryptography>=43.0,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5.0,<8",
  "httpx>=0.27,<1",
  "moto[s3]>=5.0,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
