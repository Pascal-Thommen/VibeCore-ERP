name: vibecore-sifen

services:
  sifen-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      SIFEN_ENV: test
      SIFEN_SIMULATION: "false"
      PORT: "8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
