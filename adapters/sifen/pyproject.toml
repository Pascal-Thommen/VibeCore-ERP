[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecore-sifen-adapter"
version = "1.0.0"
description = "Isolated VibeCore ERP microservice adapter for Paraguayan SIFEN electronic invoicing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "pysifen>=1.0.0",
    "lxml>=5.0.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
