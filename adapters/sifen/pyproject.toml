[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vibecore-sifen-adapter"
version = "0.1.0"
description = "VibeCore ERP SIFEN DTE Generator and RUC Resolver Adapter"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["sifen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
