[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vibecore-auth-adapter"
version = "0.1.0"
description = "VibeCore ERP Google OAuth 2.0 & OIDC SSO Adapter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.9,<3",
  "cryptography>=43.0,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5.0,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "B008"]
