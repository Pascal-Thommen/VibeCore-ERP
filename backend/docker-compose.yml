name: vibecore-erp

x-backend-environment: &backend-environment
  APP_ENV: development
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_NAME: vibecore
  DATABASE_USER: vibecore
  DATABASE_PASSWORD_FILE: /run/secrets/postgres_password

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vibecore
      POSTGRES_USER: vibecore
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecore -d vibecore"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-environment
    secrets:
      - postgres_password
    restart: "no"

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *backend-environment
    ports:
      - "8000:8000"
    secrets:
      - postgres_password

secrets:
  postgres_password:
    file: ./.secrets/postgres_password

volumes:
  postgres_data:
