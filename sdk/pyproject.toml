[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vibecore-sdk"
version = "0.1.0"
description = "Typed Python client for the VibeCore Finance Core API"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["vibecore"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
